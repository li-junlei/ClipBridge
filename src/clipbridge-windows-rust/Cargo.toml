[package]
name = "clipbridge-desktop"
version = "0.7.0"
edition = "2024"
build = "build.rs"

[[bin]]
name = "clipbridge"
path = "src/main.rs"

[dependencies]
anyhow = "1"
async-channel = "2"
raw-window-handle = "0.6"
gpui = { version = "=0.2.2", default-features = false, features = ["windows-manifest"] }
gpui-component = "=0.5.1"
gpui-component-assets = "=0.5.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
aes-gcm = "0.10"
hmac = "0.12"
sha2 = "0.10"
hkdf = "0.12"
p256 = { version = "0.13", features = ["ecdsa", "ecdh", "pkcs8"] }
rand = "0.8"
num-bigint = { version = "0.4", features = ["rand"] }
num-traits = "0.2"
base64 = "0.22"
hex = "0.4"
unicode-normalization = "0.1"
zeroize = { version = "1", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
tokio = { version = "1", features = ["full"] }
futures = "0.3"
chrono = "0.4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "ico"] }
arboard = "3"
rfd = "0.15"
tray-icon = "0.21"
winreg = "0.55"
tokio-util = { version = "0.7", features = ["io"] }
qrcode = "0.14"
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_Security_Cryptography", "Win32_UI_WindowsAndMessaging", "Win32_System_LibraryLoader", "Win32_System_Threading", "Win32_Security", "Win32_UI_Shell", "Win32_UI_Input_KeyboardAndMouse", "Win32_Storage_FileSystem", "Win32_System_Pipes", "Win32_System_IO", "Win32_Security_Authorization", "Win32_System_WinRT", "Win32_System_Com", "UI_Notifications", "Data_Xml_Dom"] }

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 8
strip = true
