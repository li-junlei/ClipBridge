plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.plugin.compose' }
android {
    namespace 'io.clipbridge.android'
    compileSdk { version = release(37) }
    defaultConfig { testInstrumentationRunner 'io.clipbridge.android.MediaSmokeRunner'; applicationId 'io.clipbridge.android'; minSdk 29; targetSdk 36; versionCode 6; versionName '0.5.0' }
    compileOptions { coreLibraryDesugaringEnabled true; sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    buildFeatures { compose true; buildConfig true }
}
kotlin { compilerOptions { jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17 } }
dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.5'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    compileOnly 'de.robv.android.xposed:api:82'
    implementation platform('androidx.compose:compose-bom:2026.05.00')
    implementation 'androidx.activity:activity-compose:1.12.4'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.foundation:foundation'
    implementation 'androidx.compose.material:material-icons-core:1.7.8'
    implementation 'top.yukonga.miuix.kmp:miuix-ui-android:0.9.2'
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
}
